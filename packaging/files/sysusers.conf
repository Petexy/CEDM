# The account the greeter runs as.
#
# Its own rather than greetd's `greeter`: distributions provision that account
# differently, and one of them naming it something else would leave CEDM's
# service starting as a user that does not exist. This one is CEDM's to create,
# so its home, its shell and its groups are the same on every machine.
#
# The home directory is where remembered account and session choices are kept.
# Nothing else is written there, and no authentication answer ever reaches it.
# The shell is left as `-` so systemd fills in whichever `nologin` this
# distribution ships; naming one would be wrong on half of them. The directory
# itself is created by the tmpfiles fragment beside this file, because
# systemd-sysusers writes accounts and does not make homes.
u cedm-greeter - "Console Experience Desktop Manager greeter" /var/lib/console-experience-desktop-manager/greeter -

# `video` for the DRM device on a machine whose seat is not managed by logind.
# Where logind does manage it — which is the normal case, and what greetd sets
# up — the device is granted to the active session by ACL and this group is not
# what makes the greeter work.
#
# Deliberately not `input`: that group is read access to every evdev node on the
# machine, which is a keylogger's worth of privilege for a program that takes
# its input through Wayland. Gamepads reach the greeter the same way the
# keyboard does, by ACL on the active session. The one device that is not
# covered by that is the Steam Controller's hidraw node, and the udev rule
# beside this file is what grants that, to the active session rather than to a
# group.
#
# Deliberately not `audio` either, and for the same reason as `input`. The
# greeter makes four short noises — see `src/sound.rs` — and reaches the sound
# card the way it reaches everything else on this seat: udev tags `SUBSYSTEM ==
# "sound"` with `uaccess`, so logind grants /dev/snd/* to the session that is
# active, which while the login screen is up is the greeter's. Putting the
# account in `audio` instead would hand it the machine's microphones for the
# whole of every session that follows, which is a great deal to give a program
# so that it can click.
#
# A greeter whose seat was never granted them is one that logs `no audio
# output` once and goes on in silence. That is a working login screen.
m cedm-greeter video
