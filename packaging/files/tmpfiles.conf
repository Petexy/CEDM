# The three directories the greeter needs, and the differences between them.
#
# The first is the privileged broker's: state.toml lives directly in it, and the
# greeter reads that file without being able to write it. That asymmetry is the
# point — accent data the broker publishes must not be forgeable by the
# unprivileged process that displays it — so the directory stays root-owned and
# world-readable, and only the broker writes into it.
d /var/lib/console-experience-desktop-manager 0755 root root -

# The second is the greeter account's home, and nothing outside that account
# has any business in it. 0700: remembered choices are account names and
# desktop-file IDs, which is not a secret worth publishing to every process on
# the machine either.
d /var/lib/console-experience-desktop-manager/greeter 0700 cedm-greeter cedm-greeter -

# The third is where each account publishes the accent its LineXinBar is set
# to, as its session starts, for the login screen to draw it in next time. A
# greeter cannot read a home directory and must not be given a way to, so this
# is the copy that comes out to meet it.
#
# 1733, which is unusual and is the whole design:
#
#   owner  rwx  root, who is not the one writing here
#   group  -wx  anybody may create their own file
#   other  -wx  and nobody may list what anybody else called theirs
#   sticky   T  and nobody may remove or rename a file that is not theirs
#
# Search without read is what the greeter needs: it knows the account it is
# drawing and opens that one name, and there is nothing to be learnt here by
# reading the directory itself. What a file in it means is decided by who owns
# it — see `read_published_in` — so squatting on a name that has never been
# published denies that account its colour and can never forge one.
d /var/lib/console-experience-desktop-manager/published 1733 root root -
