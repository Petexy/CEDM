[package]
name = "cedm"
version = "0.9.1"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Controller-first graphical greeter for console and desktop sessions"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
gilrs = "0.11.2"
glyphon = "0.12"
libc = "0.2"
png = "0.18"
pollster = "0.4"
resvg = { version = "0.48", default-features = false }

# The four sounds the login screen answers a button with.
#
# The same crate, version and cut LineXinBar plays its own with, because these
# are its clips: `playback` is the output device and `vorbis` is the format the
# recordings are in, and every other decoder would be one compiled in for a
# file this greeter never opens. `tracing` is not optional in practice —
# without it rodio reports a lost device with `eprintln!`, and this program's
# stderr is the console greetd handed it.
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "vorbis",
    "tracing",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The keyboard layout this machine is configured for, so the board's caps are
# the letters the person in front of it actually types. A login screen is where
# that matters most: a password with an accented letter in it cannot be typed on
# a board that only offers American ones. See `src/keyboard.rs`.
xkbcommon = "0.8"

wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wgpu = "30"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "x11"] }
zeroize = "1.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
