<!--
  The route to an account the greeter cannot enumerate: an arrow arriving at a
  person.

  Two objects, and the arrow is the one that moves — it points at the figure
  rather than away from it, because what this button does is bring somebody who
  is not on the carousel *in*. Turned round it would read as signing out, which
  is the one thing on this row it is not.

  The arrowhead is a little shorter than the one the old painted drawing used.
  It had to be: that version stood the figure in front of the arrow and let a
  drop shadow separate the two, and nothing here casts a shadow onto anything
  but the flat space beside it. What separates them now is a real gap, and a gap
  narrower than the wall the material puts round each body closes up into one
  object.

  The shoulders are cut off flat at the foot rather than curving back under,
  which is what a person behind a counter looks like and what every account
  glyph has drawn since they existed.

  Scaled a hair inside its cell, like the session badge: the arrow's tail
  reached to within two units of the edge, and the shadow is drawn in those two
  units.

  lxb:shape — the material is computed from this outline; see
  src/visual/field.rs, which is where that is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="bolt" d="M1.9 14.05h7.5V10.4l5.8 5.6-5.8 5.6v-3.65H1.9z"/>
    <circle id="head" cx="23.1" cy="10.9" r="4.15"/>
    <path id="shoulders" d="M16.35 25.4a6.75 6.75 0 0 1 13.5 0z"/>
    <g id="bead">
      <use href="#bolt"/>
      <use href="#head"/>
      <use href="#shoulders"/>
    </g>
  </defs>

  <g transform="translate(16 16) scale(0.97) translate(-16 -16)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
