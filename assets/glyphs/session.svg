<!--
  The session badge: a screen on a stand.

  The drawing below is `lxb-desktop`'s `setting-display.svg`, unchanged from
  `<svg` to the end. It is the display's own glyph there and it is the right
  one here for the same reason the shell gives: a display is the only piece of
  hardware in the room the user is definitely looking at, so a picture of one
  cannot be mistaken for anything else — and what this badge names is which
  desktop is about to be put on it.

  The screen is an opening rather than a face with a picture on it, and the
  bezel, neck and foot are one object: the stand is what the bezel stands on,
  not a thing beside it. The scale in the drawing is the shell's own and is
  there to leave the shadow room inside the cell — see the margin the guard in
  src/visual/mod.rs holds every drawing to.

  lxb:shape — the material is computed from this outline; see
  src/visual/field.rs, which is where that is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="bezel" d="M4.4 5.1h23.2a2 2 0 0 1 2 2v12.9a2 2 0 0 1-2 2H4.4a2 2 0 0 1-2-2V7.1a2 2 0 0 1 2-2z"/>
    <path id="pane" d="M5.9 8.1h20.2v10.9H5.9z"/>
    <path id="neck" d="M13.4 22.4h5.2v3.8h-5.2z"/>
    <path id="foot" d="M8.6 25.7h14.8a1.1 1.1 0 0 1 1.1 1.1v0.9a1.1 1.1 0 0 1-1.1 1.1H8.6a1.1 1.1 0 0 1-1.1-1.1v-0.9a1.1 1.1 0 0 1 1.1-1.1z"/>
    <g id="bead"><use href="#bezel"/><use href="#neck"/><use href="#foot"/></g>
    <g id="holes"><use href="#pane"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#holes" fill="#000000"/>
    </mask>
  </defs>
  <g transform="translate(16 16) scale(0.963) translate(-16 -16)">
  
    <g mask="url(#pierced)">
      <use href="#bead" fill="#ffffff"/>
    </g>
  </g>
</svg>
