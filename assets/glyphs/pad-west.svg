<!--
  The left-hand face button: Xbox's X, PlayStation's Square, Nintendo's Y.
  Naming any one of those is wrong on the other two — the letters are not
  merely different, they are *swapped* between Xbox and Nintendo, so a hint
  reading "press X" sends a Switch Pro user to the button above the one meant.

  So the cluster is drawn instead, with the button being asked for filled in
  and the other three left open. Position is the one thing every gamepad
  agrees on.

  Nothing here is a pad. At the size a hint is drawn, four buttons say
  controller on their own and a body round them would only take room from them.

  The drawing below is `lxb-desktop`'s `pad-west.svg`, unchanged from `<svg` to
  the end — the same button, drawn the same way, on the two screens either side
  of a handover.

  lxb:shape — the material is computed from this outline; see
  src/visual/field.rs, which is where that is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="none" stroke="#fff" stroke-width="1.5">
    <circle cx="12" cy="5.3" r="2.7"/>
    <circle cx="18.7" cy="12" r="2.7"/>
    <circle cx="12" cy="18.7" r="2.7"/>
  </g>
  <circle cx="5.3" cy="12" r="3.4" fill="#fff"/>
</svg>
