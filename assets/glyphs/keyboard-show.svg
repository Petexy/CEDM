<!--
  The way in to the on-screen keyboard: a keyboard rising into view.

  The mirror of `keyboard-hide.svg`, which is the point — a button says what
  pressing it will do, and these two are the same object doing the two opposite
  things. The one that opens the board wore the folding-down arrow for a while,
  which told the user the board was already up and they were about to dismiss
  it. A picture that reads instantly is worse than a word when it reads
  instantly wrong.

  A slab rather than an outline, unlike its mirror, and the two are not meant to
  match: this one stands on the column beside the session badge, among objects,
  and `keyboard-hide.svg` is a cap on a key of the board itself, among the
  arrows and the letters.

  The keys are cut through the slab. They were holes in the painted drawing too,
  and for a reason that has outlived it: a keycap seen from above under a lamp
  is the dark part of a keyboard. What the material adds is that a hole is now
  free — its edge is an edge like the outside one, so each key gets the same
  wall round it, arriving from the other side.

  Four in the top rank rather than five. At the size a control on the column is
  drawn, five slots and the walls between them average into one band, and a
  keyboard with a smear across it is not a keyboard.

  lxb:shape — the material is computed from this outline; see
  src/visual/field.rs, which is where that is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <rect id="slab" x="3.6" y="13.9" width="24.8" height="14.4" rx="2.7"/>
    <g id="keys">
      <rect x="7.2" y="17.0" width="2.6" height="2.6" rx="0.8"/>
      <rect x="12.2" y="17.0" width="2.6" height="2.6" rx="0.8"/>
      <rect x="17.2" y="17.0" width="2.6" height="2.6" rx="0.8"/>
      <rect x="22.2" y="17.0" width="2.6" height="2.6" rx="0.8"/>
      <rect x="7.2" y="21.4" width="2.6" height="2.6" rx="0.8"/>
      <rect x="22.2" y="21.4" width="2.6" height="2.6" rx="0.8"/>
      <rect x="12.2" y="21.4" width="7.6" height="2.6" rx="0.9"/>
    </g>
    <!-- Up, and in. -->
    <path id="bolt" d="M16 2.3 22.1 10.5h-12.2z"/>
    <g id="bead"><use href="#slab"/><use href="#bolt"/></g>
    <mask id="pierced">
      <use href="#bead" fill="#ffffff"/>
      <use href="#keys" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
