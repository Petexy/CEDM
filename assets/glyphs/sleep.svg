<!--
  Sleep: the two bars of a pause mark, set into a ring.

  IEC 60417-5009 is the power symbol and 5010 is the toggle; there is no
  standard mark for suspend, so this borrows the one every disc player in the
  room already uses for "stopped, and where you left it" — which is what
  suspending is. A crescent moon is the other convention and it is the wrong
  one at this size: a moon is a silhouette, and a silhouette cannot be moulded.

  Built on `setting-info.svg`'s ring rather than on the power symbol's, because
  this ring is whole. That one is an annulus assembled out of a mask and a
  wedge so its gap has radial ends; nothing here has a gap, and an unbroken
  ring is one `evenodd` path with its own bore — which is also what lets the
  inner wall be stroked faintly, so the hole reads as a hole with a thickness
  around it.

  The bars are raised together as one piece set into the ring, with their own
  shallower shadow, exactly as that glyph raises its dot and stem.

  Authored in white and greys, because the greeter tints what it draws: an
  atlas quad's colour is multiplied into the texel, so anything lighter than
  white is unreachable and anything coloured could only come out muddier than
  the label beside it. The greys are not a colour — they are the shading.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every moulded glyph
         of this set on purpose. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f8f8"/>
      <stop offset="0.3" stop-color="#eeeeee"/>
      <stop offset="0.56" stop-color="#d4d4d4"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.76" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.11"/>
      <stop offset="0.2" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="drop" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="0.45" dy="1.05" stdDeviation="0.46"
                    flood-color="#303030" flood-opacity="0.48"/>
    </filter>
    <filter id="lift" x="-45%" y="-45%" width="200%" height="210%">
      <feDropShadow dx="0.22" dy="0.42" stdDeviation="0.18"
                    flood-color="#252525" flood-opacity="0.46"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.15"/>
    </filter>

    <circle id="outside" cx="16" cy="16" r="11.5"/>
    <circle id="inside" cx="16" cy="16" r="8.35"/>
    <path id="ring" fill-rule="evenodd" clip-rule="evenodd"
          d="M4.5 16a11.5 11.5 0 1 1 23 0 11.5 11.5 0 1 1-23 0z
             M7.65 16a8.35 8.35 0 1 0 16.7 0 8.35 8.35 0 1 0-16.7 0z"/>
    <!-- The polish, and its lower edge follows the ring's own swell rather
         than being ruled across it. A straight boundary turns a dome into a
         cylinder someone sawed in half. -->
    <path id="ring-gloss" d="M3 3h26v10.4c-6.6 2.4-19.4 2.4-26 0z"/>
    <clipPath id="ring-clip"><use href="#ring"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <use href="#ring" fill="url(#face)"/>
    <g clip-path="url(#ring-clip)">
      <use href="#ring-gloss" fill="url(#gloss)" filter="url(#polish)"/>
    </g>
    <use href="#ring" fill="url(#turn)"/>
    <use href="#outside" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
    <use href="#inside" fill="none" stroke="#ffffff" stroke-opacity="0.34"
         stroke-width="0.55"/>
  </g>

  <!-- The pair, raised together as one piece set into the ring. Wide enough
       apart that the gap survives the shadow between them at the size a
       footer button is drawn at, and short enough to keep air above and below
       them inside the bore. -->
  <g fill="url(#face)" stroke="url(#edge)" stroke-width="0.55"
     filter="url(#lift)">
    <rect x="12.35" y="11.3" width="2.9" height="9.4" rx="1.45"/>
    <rect x="16.75" y="11.3" width="2.9" height="9.4" rx="1.45"/>
  </g>
</svg>
