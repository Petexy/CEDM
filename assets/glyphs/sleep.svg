<!--
  Sleep: the two bars of a pause mark, set into a ring.

  IEC 60417-5009 is the power symbol and 5010 is the toggle; there is no
  standard mark for suspend, so this borrows the one every disc player in the
  room already uses for "stopped, and where you left it" — which is what
  suspending is.

  Built on `lxb-desktop`'s `setting-info.svg` rather than on the power symbol's
  ring, because this ring is whole. That one is an annulus assembled out of a
  mask and a wedge so its gap has radial ends; nothing here has a gap, and an
  unbroken ring is one `evenodd` path with its own bore.

  Three bodies and no crevices: the bore is wide enough that the pair inside it
  has air all the way round, and the gap between the two bars is a unit and a
  half, which is what keeps them two bars rather than one wide one once the
  material has put a wall down either side of it.

  lxb:shape — the material is computed from this outline; see
  src/visual/field.rs, which is where that is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g fill="#fff">
    <path fill-rule="evenodd" clip-rule="evenodd"
          d="M4.5 16a11.5 11.5 0 1 1 23 0 11.5 11.5 0 1 1-23 0z M7.65 16a8.35 8.35 0 1 0 16.7 0 8.35 8.35 0 1 0-16.7 0z"/>
    <rect x="12.35" y="11.3" width="2.9" height="9.4" rx="1.45"/>
    <rect x="16.75" y="11.3" width="2.9" height="9.4" rx="1.45"/>
  </g>
</svg>
