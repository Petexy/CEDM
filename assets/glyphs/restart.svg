<!--
  Restart: two arrows chasing each other round a circle.

  The drawing below is `lxb-desktop`'s `refresh.svg`, unchanged from `<svg` to
  the end. Its own name there is about asking a library for its contents again;
  the picture is the same picture, and a cycle is what a machine going down and
  coming back up is — two journeys and not one, which is exactly why the shell
  drew it as two arms rather than as one arrow returning to its start.

  The gap between the two arms is the mark: a closed ring says nothing about
  direction, and direction is the whole of what this button means.

  lxb:shape — the material is computed from this outline; see
  src/visual/field.rs, which is where that is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <path id="arm"
          d="M5.27 14.11A10.9 10.9 0 0 1 22.25 7.07L23.23 5.68 26.18 12.63
             18.64 12.23 19.61 10.84A6.3 6.3 0 0 0 9.8 14.91z"/>
  </defs>

  <g fill="#fff">
    <use href="#arm"/>
    <use href="#arm" transform="rotate(180 16 16)"/>
  </g>
</svg>
