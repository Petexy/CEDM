<!--
  The south face button: Xbox's A, PlayStation's Cross, Nintendo's B.

  The cluster again, with the bead moved round it — pad-west.svg's rule, and
  pad-west.svg's reason. South is Accept on every layout ever sold, whatever
  letter that pad prints on it, so this is the button that says a thing is
  being taken.

  The drawing below is `lxb-desktop`'s `pad-south.svg`, unchanged from `<svg`
  to the end — the same button, drawn the same way, on the two screens either
  side of a handover.

  lxb:shape — the material is computed from this outline; see
  src/visual/field.rs, which is where that is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="none" stroke="#fff" stroke-width="1.5">
    <circle cx="12" cy="5.3" r="2.7"/>
    <circle cx="18.7" cy="12" r="2.7"/>
    <circle cx="5.3" cy="12" r="2.7"/>
  </g>
  <circle cx="12" cy="18.7" r="3.4" fill="#fff"/>
</svg>
