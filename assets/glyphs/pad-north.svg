<!--
  The north face button: Xbox's Y, PlayStation's Triangle, Nintendo's X.

  The cluster once more, the bead at the top. In the shell this is the button
  that asks what else can be done to a thing; here it is the one that raises
  the on-screen keyboard and puts it away again, which is the same kind of
  press — the one that is not about the row under the light.

  The drawing below is `lxb-desktop`'s `pad-north.svg`, unchanged from `<svg`
  to the end — the same button, drawn the same way, on the two screens either
  side of a handover.

  lxb:shape — the material is computed from this outline; see
  src/visual/field.rs, which is where that is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="none" stroke="#fff" stroke-width="1.5">
    <circle cx="18.7" cy="12" r="2.7"/>
    <circle cx="12" cy="18.7" r="2.7"/>
    <circle cx="5.3" cy="12" r="2.7"/>
  </g>
  <circle cx="12" cy="5.3" r="3.4" fill="#fff"/>
</svg>
