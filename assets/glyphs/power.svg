<!--
  Shut down: IEC 60417-5009, the ring broken at the top with a bar standing in
  the gap.

  The drawing below is `lxb-desktop`'s `shutdown.svg`, unchanged from `<svg` to
  the end — the greeter and the shell it hands over to must not put two
  different power symbols in front of the same user four seconds apart. Only
  this header differs, because the shell's names the guide's sidebar and this
  one stands in a login screen's bottom row.

  Moulded white plastic under one lamp above it, which is the material every
  object in this row is made of. It replaced a flat mark drawn out of two
  strokes, and the shell's own note on why says it best: everything around it is
  a moulded object under one lamp, and a flat one among them reads as the one
  control that has not finished loading.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- The material, and the lamp above it. Identical in every glyph of
         this set on purpose: see pointer-stick.svg, which explains what each
         of these is doing and why the gloss is a shape rather than a stop. -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="0.35" stop-color="#e9e9e9"/>
      <stop offset="0.58" stop-color="#d6d6d6"/>
      <stop offset="0.78" stop-color="#dfdfdf"/>
      <stop offset="0.92" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="turn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="0.22" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0.5" dy="1.25" stdDeviation="0.5"
                    flood-color="#3c3c3c" flood-opacity="0.5"/>
    </filter>
    <filter id="polish" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.16"/>
    </filter>

    <!-- The inner wall of the ring, lit the other way to the outer face. -->
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="0.34" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <path id="ring-gloss" d="M2 2H30V15.6C25.24 18 6.76 18 2 15.6z"/>
    <path id="bar-gloss" d="M12 1H20V9.4C18.64 10.6 13.36 10.6 12 9.4z"/>
    <mask id="ring-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <circle cx="16" cy="16.6" r="11.6" fill="#ffffff"/>
      <circle cx="16" cy="16.6" r="7.9" fill="#000000"/>
      <!-- The gap the bar stands in, cut as a wedge from the centre so both
           of its ends are radial. -->
      <path d="M16 16.6L9.4 0h13.2z" fill="#000000"/>
    </mask>
    <clipPath id="bar-clip"><rect x="14.1" y="3.4" width="3.8" height="12" rx="1.9"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <g mask="url(#ring-mask)">
      <rect x="4" y="4.6" width="24" height="24" fill="url(#face)"/>
      <use href="#ring-gloss" fill="url(#gloss)" filter="url(#polish)"/>
      <rect x="4" y="4.6" width="24" height="24" fill="url(#turn)"/>
      <circle cx="16" cy="16.6" r="11.6" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
      <circle cx="16" cy="16.6" r="7.9" fill="none" stroke="url(#wall)" stroke-width="1.4"/>
    </g>

    <!-- The bar, standing in the gap. -->
    <rect x="14.1" y="3.4" width="3.8" height="12" rx="1.9" fill="url(#face)"/>
    <g clip-path="url(#bar-clip)">
      <use href="#bar-gloss" fill="url(#gloss)" filter="url(#polish)"/>
      <rect x="14.1" y="3.4" width="3.8" height="12" rx="1.9"
            fill="none" stroke="url(#edge)" stroke-width="1"/>
    </g>
    <rect x="14.1" y="3.4" width="3.8" height="12" rx="1.9" fill="url(#turn)"/>
  </g>
</svg>
