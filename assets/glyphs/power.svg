<!--
  Shut down: IEC 60417-5009, the ring broken at the top with a bar standing in
  the gap.

  The drawing below is `lxb-desktop`'s `shutdown.svg`, unchanged from `<svg` to
  the end — the greeter and the shell it hands over to must not put two
  different power symbols in front of the same user four seconds apart. Only
  this header differs, because the shell's names the guide's sidebar and this
  one stands in a login screen's bottom row.

  lxb:shape — the material is computed from this outline; see
  src/visual/field.rs, which is where that is explained.
-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <circle id="ring" cx="16" cy="16.6" r="11.6"/>
    <circle id="bore" cx="16" cy="16.6" r="7.9"/>
    <path id="break" d="M16 16.6L10.4 0h11.2z"/>
    <rect id="bar" x="14.1" y="3.4" width="3.8" height="12" rx="1.9"/>
    <g id="bead"><use href="#ring"/><use href="#bar"/></g>
    <mask id="pierced">
      <use href="#ring" fill="#ffffff"/>
      <use href="#bore" fill="#000000"/>
      <use href="#break" fill="#000000"/>
      <use href="#bar" fill="#ffffff"/>
    </mask>
  </defs>

  <g mask="url(#pierced)">
    <use href="#bead" fill="#ffffff"/>
  </g>
</svg>
